<!DOCTYPE html>
<html lang="en">

<Head>
    <meta charset="utf-8">
        <!--
    Name: Evan Chen
    File: layouttask.html
    Date: 23 October 2026
    Description: A blog layout using flexbox, grid, floats, and positioning.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Layout Task</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: white;
            color: #333;
            margin: 0;
            font: 1.2em / 1.6 sans-serif;
        }
        img {
            max-width: 100%;
            display: block;
            border: 1px solid black;
        }

        .logo {
            font-size: 200%;
            padding: 50px 20px;
            margin: 0 auto;
            max-width: 980px;
        }
        .grid {
            display: grid;
            grid-template-columns: minmax(0, 3fr) minmax(0, 1fr);
            gap: 20px;
            margin: 0 auto;
            max-width: 980px;
        }

        /* Keep navigation at the top after scrolling to it. */
        nav {
            background-color: black;
            padding: 0.5em;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        nav ul {
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        nav a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 0.5em 1em;
        }
        
</head>
</html>
