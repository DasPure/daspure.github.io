<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
     <!--
    Name: Evan Chen
    File: collegehomepage.html
    Date: 23 October 2026
    Description: A community college homepage with CSS text styling.
    -->
     <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>St Huxley's Community College</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&amp;family=Roboto+Slab:wght@700&amp;display=swap"
        rel="stylesheet">

    <style>
         * {
            box-sizing: border-box;
        }

        html {
            font-size: 10px;
        }

        body {
            margin: 0 auto;
            padding: 0 20px;
            min-width: 980px;
            max-width: 1400px;
            font-family: "Lora", Georgia, serif;
            font-size: 1.6rem;
            line-height: 1.6;
            letter-spacing: 0.03rem;
            color: #222;
        }
        main {
            display: grid;
            grid-template-columns: 5fr 2fr 2fr;
            gap: 40px;
            padding: 20px 0;
        }

        header {
            border-bottom: 5px solid #aa6666;
        }

        footer {
            border-top: 5px solid #aa6666;
        }
        footer p {
            text-align: center;
        }

        h1,
        h2 {
            font-family: "Roboto Slab", Georgia, serif;
            letter-spacing: 0.1rem;
        }

        h1 {
            font-size: 3.6rem;
            text-align: center;
        }
         h2 {
            font-size: 2.4rem;
            margin-bottom: 0;
        }

        p,
        ul,
        ol {
            margin-top: 1.6rem;
            margin-bottom: 1.6rem;
            line-height: 1.6;
        }
        section h2 + p {
            text-indent: 2rem;
        }

        a:link {
            color: #914b4b;
        }

        a:visited {
            color: #70465f;
        }

        a {
            text-decoration: underline;
            outline: none;
        }

        a:hover,
        a:focus {
            color: #542828;
            background-color: #f3e6e6;
            text-decoration: none;
        }
    </style>

</html>
