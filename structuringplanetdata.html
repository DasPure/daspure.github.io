<html lang="en">
<head>
     <meta charset="utf-8">
    <!--
    Name: Evan Chen
    File: index.html
    Date: 7 October 2026
    Description: An accessible table containing the supplied planetary data.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Data Table</title>

    <style>
        html {
            font-family: sans-serif;
        }

        body {
            margin: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            border: 2px solid #c8c8c8;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        th,
        td {
            border: 1px solid #bebebe;
            padding: 10px 20px;
        }

        th {
            background-color: #ebebeb;
        }

        td {
            text-align: center;
        }

        tbody tr:nth-child(even) td {
            background-color: #fafafa;
        }

        tbody tr:nth-child(odd) td {
            background-color: #f5f5f5;
        }

        caption {
            padding: 10px;
        }

        .column-border {
            border: 2px solid black;
        }
    </style>
</head>
