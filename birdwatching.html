<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="utf-8">
    <title>Birdwatching</title>
    <link
        href="https://fonts.googleapis.com/css?family=Roboto+Condensed:300%7CCinzel+Decorative:700"
        rel="stylesheet">
    <style>
        html {
            font-size: 10px;
            background-color: darkgrey;
        }
        body {
            width: 70%;
            min-width: 800px;
            margin: 0 auto;
        }

        h1, h2 {
            font-family: "Cinzel Decorative" cursive;
            color: #2a2a2a;

        }
        p, li {
            font-family: "Roboto Condensed", sans-serif;
            color: #2a2a2a;
            font-size: 1.6rem;
            line-height: 1.5;


        }
        
        h1 {
            font-size: 4rem;
            text-align: center;
             text-transform: uppercase;
            text-shadow: 2px 2px 10px black;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

         h2 {
            font-size: 3rem;
            text-align: center;
        }

        header {
            margin-bottom: 10px;
        }

        header, nav, main, article, aside, footer {
            background-color: #00ff0080;
            padding: 1%;
        }

        header img {
            height: 60px;
        }

        nav ul {
            padding: 0;
            list-style-type: none;
            display: flex;
        }

          nav li {
            text-align: center;
            flex: 1;
        }

        nav a {
            font-size: 2rem;
            text-transform: uppercase;
            text-decoration: none;
            color: black;
        }
